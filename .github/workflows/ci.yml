name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This project uses Yarn Berry (see packageManager in package.json); Corepack
      # provisions the pinned version. Enable it before setup-node so the cache and
      # install use that Yarn, not the runner's bundled Yarn 1.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: i18n catalog parity (EN/ES)
        run: node scripts/check-i18n.mjs

      - name: Unit tests (Vitest)
        run: yarn test

      - name: Build
        run: yarn build
